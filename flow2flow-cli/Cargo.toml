[package]
name = "flow2flow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["inmem-registry"]
inmem-registry = ["once_cell"]

[dependencies]
flow2flow-contract = { workspace = true }
flow2flow-runtime = { workspace = true }
flow2flow-router-adapter = { workspace = true }
semver = { version = "1", features = ["serde"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
once_cell = { version = "1", optional = true }

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
