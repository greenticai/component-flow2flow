name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  dry-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate:
          - flow2flow-contract
          - flow2flow-runtime
          - flow2flow-router-adapter
          - flow2flow-cli
          - conformance
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.89.0"
      - name: Verify Workspace Lockfile
        run: cargo metadata --locked --format-version 1
      - name: Dry-run publish ${{ matrix.crate }}
        run: cargo publish -p ${{ matrix.crate }} --locked --dry-run

  publish:
    needs: dry-run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate:
          - flow2flow-contract
          - flow2flow-runtime
          - flow2flow-router-adapter
          - flow2flow-cli
          - conformance
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.89.0"
      - name: Publish ${{ matrix.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ${{ matrix.crate }} --locked
